events {
    worker_connections 1024;
}

http {

    # ─── Upstream: Load Balancer ───────────────────────────────────────────

    upstream eventos_upstream {
        server eventos:5000;
        # Docker Compose scale adiciona mais instâncias automaticamente
    }

    upstream compras_upstream {
        server compras:5000;
    }

    # ─── API Gateway ──────────────────────────────────────────────────────

    server {
        listen 80;

        # Rota: Serviço de Eventos
        location /api/eventos/ {
            proxy_pass http://eventos_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Rota: Serviço de Compras
        location /api/compras/ {
            proxy_pass http://compras_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health check do próprio Nginx
        location /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
