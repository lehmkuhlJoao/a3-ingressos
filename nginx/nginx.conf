events {
    worker_connections 1024;
}

http {

    # ─── Upstream: Load Balancer pools ────────────────────────────────────────

    upstream eventos_pool {
        server eventos:5000;
        keepalive 0;
    }

    upstream compras_pool {
        server compras:5000;
        keepalive 0;
    }

    # ─── Server: API Gateway ──────────────────────────────────────────────────

    server {
        listen 80;

        # ── Eventos ─────────────────────────────────────────────────────────
        location /eventos {
            proxy_pass http://eventos_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Compras ─────────────────────────────────────────────────────────
        location /compras {
            proxy_pass http://compras_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Usuários (também no serviço de compras) ──────────────────────────
        location /usuarios {
            proxy_pass http://compras_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
