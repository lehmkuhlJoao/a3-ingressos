<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A3 — Load Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a24;
    --border: #2a2a3a;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --accent: #7c6aff;
    --accent2: #00d4aa;
    --green: #00d4aa;
    --red: #ff4d6a;
    --yellow: #ffb347;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Syne', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-columns: 320px 1fr;
    grid-template-rows: 60px 1fr;
  }

  /* ── Header ── */
  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    gap: 16px;
  }

  .logo {
    font-family: var(--sans);
    font-weight: 800;
    font-size: 16px;
    letter-spacing: -0.5px;
    color: var(--text);
  }

  .logo span { color: var(--accent); }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(0, 212, 170, 0.1);
    border: 1px solid rgba(0, 212, 170, 0.3);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    color: var(--green);
    letter-spacing: 0.5px;
  }

  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .stats-header {
    margin-left: auto;
    display: flex;
    gap: 24px;
  }

  .stat-item { text-align: right; }
  .stat-label { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .stat-value { font-size: 18px; font-weight: 600; color: var(--text); font-family: var(--sans); }
  .stat-value.green { color: var(--green); }
  .stat-value.red { color: var(--red); }

  /* ── Sidebar ── */
  aside {
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Tab nav ── */
  .tab-nav {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .tab-btn {
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.5px;
    padding: 12px 4px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
    text-transform: uppercase;
  }

  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* ── Sidebar scrollable body ── */
  .aside-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .aside-body::-webkit-scrollbar { width: 4px; }
  .aside-body::-webkit-scrollbar-track { background: transparent; }
  .aside-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .section-title {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  /* ── Config panels ── */
  .panel { display: none; flex-direction: column; }
  .panel.active { display: flex; }

  .panel-desc {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.7;
  }

  /* ── Config fields ── */
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .field label { font-size: 11px; color: var(--muted); letter-spacing: 0.5px; }

  .field-row {
    display: flex;
    align-items: center;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .field-row input {
    background: transparent;
    border: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    padding: 10px 12px;
    width: 100%;
    outline: none;
  }

  .field-unit {
    padding: 0 12px;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  /* ── Progress ── */
  .progress-wrap {
    background: var(--surface2);
    border-radius: 4px;
    height: 4px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 4px;
    transition: width 0.3s ease;
    width: 0%;
  }

  .progress-label {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
    display: flex;
    justify-content: space-between;
  }

  /* ── Buttons ── */
  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.15s ease;
    margin-bottom: 8px;
  }

  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover:not(:disabled) { background: #6a58ee; }

  .btn-green {
    background: rgba(0, 212, 170, 0.15);
    color: var(--green);
    border: 1px solid rgba(0, 212, 170, 0.3);
  }
  .btn-green:hover:not(:disabled) { background: rgba(0, 212, 170, 0.25); }

  .btn-yellow {
    background: rgba(255, 179, 71, 0.15);
    color: var(--yellow);
    border: 1px solid rgba(255, 179, 71, 0.3);
  }
  .btn-yellow:hover:not(:disabled) { background: rgba(255, 179, 71, 0.25); }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover:not(:disabled) { border-color: var(--muted); color: var(--text); }

  /* ── Main ── */
  main {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }

  .log-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .log-header-title {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .log-container {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 16px 24px;
    font-size: 12px;
    line-height: 2;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .log-container::-webkit-scrollbar { width: 4px; }
  .log-container::-webkit-scrollbar-track { background: transparent; }
  .log-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .log-line { display: flex; gap: 12px; align-items: baseline; min-width: 0; }
  .log-time { color: var(--muted); font-size: 10px; white-space: nowrap; min-width: 60px; flex-shrink: 0; }
  .log-msg { flex: 1; min-width: 0; overflow-wrap: break-word; word-break: break-word; }

  .badge {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.5px;
  padding: 1px 6px;
  border-radius: 4px;
  white-space: nowrap;
  flex-shrink: 0;
}
.badge-compra   { background: rgba(124,106,255,0.2); color: #7c6aff; }
.badge-leitura  { background: rgba(0,212,170,0.15);  color: #00d4aa; }
.badge-evento   { background: rgba(255,179,71,0.15); color: #ffb347; }
.badge-usuario  { background: rgba(255,77,106,0.15); color: #ff4d6a; }

  .log-ok { color: var(--green); }
  .log-err { color: var(--red); }
  .log-warn { color: var(--yellow); }
  .log-info { color: var(--accent); }
  .log-sep { color: var(--border); }

  /* ── Throughput chart ── */
  .chart-section {
    border-top: 1px solid var(--border);
    padding: 16px 24px;
    height: 100px;
    flex-shrink: 0;
  }

  .chart-label {
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  canvas { width: 100%; height: 60px; display: block; }
</style>
</head>
<body>

<header>
  <div class="logo">A3<span>://</span>simulator</div>
  <div class="status-pill"><div class="dot"></div>ONLINE</div>
  <div class="stats-header">
    <div class="stat-item">
      <div class="stat-label">Sucesso</div>
      <div class="stat-value green" id="count-ok">0</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Erro</div>
      <div class="stat-value red" id="count-err">0</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Total</div>
      <div class="stat-value" id="count-total">0</div>
    </div>
  </div>
</header>

<aside>
  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="setup">Setup</button>
    <button class="tab-btn" data-tab="compras">Compras</button>
    <button class="tab-btn" data-tab="leituras">Leituras</button>
    <button class="tab-btn" data-tab="completo">Completo</button>
  </nav>

  <div class="aside-body">

    <!-- Setup panel -->
    <div id="panel-setup" class="panel active">
      <div class="section-title">Setup Inicial</div>
      <p class="panel-desc">Cria os eventos e usuários base necessários para as simulações. Usuários já existentes são ignorados (HTTP 409).</p>
    </div>

    <!-- Compras panel -->
    <div id="panel-compras" class="panel">
      <div class="section-title">Configuração</div>
      <div class="field">
        <label>Número de compras</label>
        <div class="field-row">
          <input type="number" id="cfg-compras" value="15" min="1" max="500">
          <span class="field-unit">req</span>
        </div>
      </div>
      <div class="field">
        <label>Delay entre requisições</label>
        <div class="field-row">
          <input type="number" id="cfg-delay" value="200" min="0" max="5000" step="50">
          <span class="field-unit">ms</span>
        </div>
      </div>
    </div>

    <!-- Leituras panel -->
    <div id="panel-leituras" class="panel">
      <div class="section-title">Configuração</div>
      <div class="field">
        <label>Número de leituras</label>
        <div class="field-row">
          <input type="number" id="cfg-leituras" value="20" min="1" max="500">
          <span class="field-unit">req</span>
        </div>
      </div>
      <div class="field">
        <label>Delay entre requisições</label>
        <div class="field-row">
          <input type="number" id="cfg-delay-leituras" value="200" min="0" max="5000" step="50">
          <span class="field-unit">ms</span>
        </div>
      </div>
    </div>

    <!-- Completo panel -->
    <div id="panel-completo" class="panel">
      <div class="section-title">Configuração</div>
      <div class="field">
        <label>Compras</label>
        <div class="field-row">
          <input type="number" id="cfg-compras-completo" value="15" min="1" max="500">
          <span class="field-unit">req</span>
        </div>
      </div>
      <div class="field">
        <label>Leituras</label>
        <div class="field-row">
          <input type="number" id="cfg-leituras-completo" value="20" min="1" max="500">
          <span class="field-unit">req</span>
        </div>
      </div>
      <div class="field">
        <label>Delay entre requisições</label>
        <div class="field-row">
          <input type="number" id="cfg-delay-completo" value="200" min="0" max="5000" step="50">
          <span class="field-unit">ms</span>
        </div>
      </div>
    </div>

    <!-- Shared progress (único no DOM) -->
    <div>
      <div class="section-title">Progresso</div>
      <div class="progress-wrap">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="progress-label">
        <span id="progress-text">Aguardando</span>
        <span id="progress-pct">—</span>
      </div>
    </div>

    <!-- Shared action buttons -->
    <div>
      <div class="section-title">Ação</div>
      <button id="btn-run" class="btn btn-ghost" onclick="runActive()">⬡ Setup inicial</button>
      <button class="btn btn-ghost" onclick="clearLog()" style="margin-top:0">✕ Limpar log</button>
    </div>

  </div>
</aside>

<!-- Shared main: log e chart são únicos no DOM -->
<main>
  <div class="log-header">
    <span class="log-header-title">Output</span>
    <span class="log-header-title" id="running-label" style="color:var(--accent)"></span>
  </div>
  <div class="log-container" id="log"></div>
  <div class="chart-section">
    <div class="chart-label">Throughput (req/s)</div>
    <canvas id="chart"></canvas>
  </div>
</main>

<script>
const BASE = 'http://localhost';
const EVENTOS = [
  {nome:'Show do Metallica',data:'2026-08-10',valor:250.0,quantidade:100},
  {nome:'Festival de Jazz',data:'2026-07-20',valor:80.0,quantidade:200},
  {nome:'Peça de Teatro',data:'2026-09-05',valor:50.0,quantidade:150},
  {nome:'Stand Up Comedy',data:'2026-06-30',valor:60.0,quantidade:80},
  {nome:'Show de Rock Nacional',data:'2026-10-15',valor:120.0,quantidade:300},
];
const USUARIOS = [
  {nome:'João Silva',email:'joao@email.com',senha:'senha123'},
  {nome:'Maria Souza',email:'maria@email.com',senha:'senha123'},
  {nome:'Pedro Lima',email:'pedro@email.com',senha:'senha123'},
  {nome:'Ana Costa',email:'ana@email.com',senha:'senha123'},
  {nome:'Lucas Martins',email:'lucas@email.com',senha:'senha123'},
];
const METODOS = ['pix','boleto','cartao'];

let okCount = 0, errCount = 0, total = 0;
const throughputData = new Array(40).fill(0);
let reqsThisSec = 0;
let activeTab = 'setup';

// ── Tab switching ────────────────────────────────────────────────────────────
const TAB_META = {
  setup:    { label: '⬡ Setup inicial',       cls: 'btn-ghost'   },
  compras:  { label: '↑ Simular compras',      cls: 'btn-green'   },
  leituras: { label: '↓ Simular leituras',     cls: 'btn-yellow'  },
  completo: { label: '◈ Simulação completa',   cls: 'btn-primary' },
};

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;
    if (tab === activeTab) return;
    document.querySelector('.tab-btn.active').classList.remove('active');
    document.querySelector('.panel.active').classList.remove('active');
    btn.classList.add('active');
    document.getElementById('panel-' + tab).classList.add('active');
    activeTab = tab;
    const runBtn = document.getElementById('btn-run');
    runBtn.textContent = TAB_META[tab].label;
    runBtn.className = 'btn ' + TAB_META[tab].cls;
  });
});

function runActive() {
  const actions = { setup: runSetup, compras: runCompras, leituras: runLeituras, completo: runCompleto };
  actions[activeTab]?.();
}

// ── Throughput ticker ────────────────────────────────────────────────────────
setInterval(() => {
  throughputData.push(reqsThisSec);
  throughputData.shift();
  reqsThisSec = 0;
  drawChart();
}, 1000);

// ── Utilities ────────────────────────────────────────────────────────────────
function uuid() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random()*16|0;
    return (c==='x'?r:(r&0x3|0x8)).toString(16);
  });
}

function now() {
  return new Date().toTimeString().slice(0,8);
}

function log(msg, type='', badge='') {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  line.className = 'log-line';
  const badgeHtml = badge
    ? `<span class="badge badge-${badge}">${badge.toUpperCase()}</span>`
    : '';
  line.innerHTML = `<span class="log-time">${now()}</span>${badgeHtml}<span class="log-msg log-${type}">${msg}</span>`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function sep(title) {
  log(`── ${title} ${'─'.repeat(Math.max(0,36-title.length))}`, 'sep');
}

function clearLog() {
  document.getElementById('log').innerHTML = '';
  okCount = 0; errCount = 0; total = 0;
  updateStats();
  setProgress(0, 'Aguardando', '—');
}

function updateStats() {
  document.getElementById('count-ok').textContent = okCount;
  document.getElementById('count-err').textContent = errCount;
  document.getElementById('count-total').textContent = total;
}

function incOk() { okCount++; total++; reqsThisSec++; updateStats(); }
function incErr() { errCount++; total++; reqsThisSec++; updateStats(); }

function setProgress(pct, label, pctLabel) {
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-text').textContent = label;
  document.getElementById('progress-pct').textContent = pctLabel;
}

function setRunning(label) {
  document.getElementById('running-label').textContent = label ? '● ' + label : '';
}

function setIdle() {
  document.getElementById('running-label').textContent = '';
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

async function post(url, body) {
  const r = await fetch(BASE + url, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  return {status: r.status, data: await r.json()};
}

async function get(url) {
  const r = await fetch(BASE + url);
  return {status: r.status, data: await r.json()};
}

// ── Simulation functions ─────────────────────────────────────────────────────
async function runSetup() {

  setRunning('Setup');
  sep('Criando eventos');
  for (const e of EVENTOS) {
    try {
      const {status, data} = await post('/eventos', e);
      if (status === 201) { log(`✓ ${e.nome} (id=${data.id})`, 'ok', 'evento'); incOk(); }
      else { log(`✗ ${e.nome} — ${status}`, 'err', 'evento'); incErr(); }
    } catch { log(`✗ ${e.nome} — conexão recusada`, 'err', 'evento'); incErr(); }
  }
  sep('Criando usuários');
  for (const u of USUARIOS) {
    try {
      const {status, data} = await post('/usuarios', u);
      if (status === 201) { log(`✓ ${u.nome} (id=${data.id})`, 'ok', 'usuario'); incOk(); }
      else if (status === 409) { log(`~ ${u.nome} já existe`, 'warn', 'usuario'); }
      else { log(`✗ ${u.nome} — ${status}`, 'err', 'usuario'); incErr(); }
    } catch { log(`✗ ${u.nome} — conexão recusada`, 'err', 'usuario'); incErr(); }
  }
  setIdle();
  setProgress(100, 'Setup concluído', '100%');
  }

  async function runCompras() {

  setRunning('Compras');
  const n = parseInt(document.getElementById('cfg-compras').value) || 15;
  const ms = parseInt(document.getElementById('cfg-delay').value) || 200;
  sep(`Simulando ${n} compras`);

  let eventos = [];
  try {
    const {data} = await get('/eventos/');
    eventos = data.filter(e => e.quantidade > 0).map(e => e.id);
  } catch { log('✗ Não foi possível buscar eventos.', 'err'); setIdle(); return; }

  if (!eventos.length) { log('✗ Nenhum evento disponível. Faça o setup primeiro.', 'err'); setIdle(); return; }

  const usuarioIds = [1,2,3,4,5];
  let s = 0, f = 0;

  for (let i = 0; i < n; i++) {
    const body = {
      transaction_id: uuid(),
      usuario_id: usuarioIds[Math.floor(Math.random()*usuarioIds.length)],
      evento_id: eventos[Math.floor(Math.random()*eventos.length)],
      quantidade: Math.floor(Math.random()*3)+1,
      metodo_pagamento: METODOS[Math.floor(Math.random()*METODOS.length)],
    };
    try {
      const {status, data} = await post('/compras', body);
      if (status === 201) {
        s++; incOk();
        log(`✓ ${i+1}/${n} — evento ${body.evento_id} via ${body.metodo_pagamento}`, 'ok', 'compra');
      } else {
        f++; incErr();
        log(`✗ ${i+1}/${n} — ${data.detail || status}`, 'err', 'compra');
      }
    } catch { f++; incErr(); log(`✗ ${i+1}/${n} — timeout`, 'err', 'compra'); }
    setProgress(Math.round((i+1)/n*100), `Compra ${i+1}/${n}`, `${Math.round((i+1)/n*100)}%`);
    await delay(ms);
  }
  log(`→ ${s} sucesso / ${f} falha`, 'info');
  setIdle();
  }

  async function runLeituras() {

  setRunning('Leituras');
  const n = parseInt(document.getElementById('cfg-leituras').value) || 20;
  const ms = parseInt(document.getElementById('cfg-delay-leituras').value) || 200;
  sep(`Simulando ${n} leituras`);
  for (let i = 0; i < n; i++) {
    try {
      const {status} = await get('/eventos/');
      log(`✓ GET /eventos/ — ${status} (${i+1}/${n})`, 'ok', 'leitura'); incOk();
    } catch { log(`✗ GET /eventos/ — timeout`, 'err', 'leitura'); incErr(); }
    setProgress(Math.round((i+1)/n*100), `Leitura ${i+1}/${n}`, `${Math.round((i+1)/n*100)}%`);
    await delay(ms);
  }
  setIdle();
  }

  async function runCompleto() {

  setRunning('Simulação completa');

  sep('Criando eventos');
  for (const e of EVENTOS) {
    try {
      const {status, data} = await post('/eventos', e);
      if (status === 201) { log(`✓ ${e.nome} (id=${data.id})`, 'ok', 'evento'); incOk(); }
      else { log(`✗ ${e.nome} — ${status}`, 'err', 'evento'); incErr(); }
    } catch { log(`✗ ${e.nome} — conexão recusada`, 'err', 'evento'); incErr(); }
  }

  sep('Criando usuários');
  for (const u of USUARIOS) {
    try {
      const {status, data} = await post('/usuarios', u);
      if (status === 201) { log(`✓ ${u.nome} (id=${data.id})`, 'ok', 'usuario'); incOk(); }
      else if (status === 409) { log(`~ ${u.nome} já existe`, 'warn', 'usuario'); }
      else { log(`✗ ${u.nome} — ${status}`, 'err', 'usuario'); incErr(); }
    } catch { log(`✗ ${u.nome} — conexão recusada`, 'err', 'usuario'); incErr(); }
  }

  const n_l = parseInt(document.getElementById('cfg-leituras-completo').value) || 20;
  const n_c = parseInt(document.getElementById('cfg-compras-completo').value) || 15;
  const ms  = parseInt(document.getElementById('cfg-delay-completo').value)   || 200;

  sep(`Simulando ${n_l} leituras`);
  for (let i = 0; i < n_l; i++) {
    try {
      const {status} = await get('/eventos/');
      log(`✓ GET /eventos/ — ${status} (${i+1}/${n_l})`, 'ok', 'leitura'); incOk();
    } catch { log(`✗ GET /eventos/ — timeout`, 'err', 'leitura'); incErr(); }
    setProgress(Math.round((i+1)/n_l*100), `Leitura ${i+1}/${n_l}`, `${Math.round((i+1)/n_l*100)}%`);
    await delay(ms);
  }

  sep(`Simulando ${n_c} compras`);
  let eventos = [];
  try {
    const {data} = await get('/eventos/');
    eventos = data.filter(e => e.quantidade > 0).map(e => e.id);
  } catch { log('✗ Não foi possível buscar eventos.', 'err'); setIdle(); return; }

  const usuarioIds = [1,2,3,4,5];
  let s = 0, f = 0;
  for (let i = 0; i < n_c; i++) {
    const body = {
      transaction_id: uuid(),
      usuario_id: usuarioIds[Math.floor(Math.random()*usuarioIds.length)],
      evento_id: eventos[Math.floor(Math.random()*eventos.length)],
      quantidade: Math.floor(Math.random()*3)+1,
      metodo_pagamento: METODOS[Math.floor(Math.random()*METODOS.length)],
    };
    try {
      const {status, data} = await post('/compras', body);
      if (status === 201) { s++; incOk(); log(`✓ ${i+1}/${n_c} — evento ${body.evento_id} via ${body.metodo_pagamento}`, 'ok', 'compra'); }
      else { f++; incErr(); log(`✗ ${i+1}/${n_c} — ${data.detail || status}`, 'err', 'compra'); }
    } catch { f++; incErr(); log(`✗ ${i+1}/${n_c} — timeout`, 'err', 'compra'); }
    setProgress(Math.round((i+1)/n_c*100), `Compra ${i+1}/${n_c}`, `${Math.round((i+1)/n_c*100)}%`);
    await delay(ms);
  }
  log(`→ ${s} sucesso / ${f} falha`, 'info');
  log('✓ Simulação completa finalizada.', 'info');
  setIdle();
}

// ── Mini chart ───────────────────────────────────────────────────────────────
function drawChart() {
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth * window.devicePixelRatio;
  canvas.height = 60 * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  const w = canvas.offsetWidth, h = 60;
  ctx.clearRect(0, 0, w, h);
  const max = Math.max(...throughputData, 1);
  const step = w / (throughputData.length - 1);
  ctx.beginPath();
  throughputData.forEach((v, i) => {
    const x = i * step;
    const y = h - (v / max) * (h - 4);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.strokeStyle = '#7c6aff';
  ctx.lineWidth = 1.5;
  ctx.lineJoin = 'round';
  ctx.stroke();

  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, 'rgba(124,106,255,0.3)');
  grad.addColorStop(1, 'rgba(124,106,255,0)');
  ctx.lineTo(w, h); ctx.lineTo(0, h);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();
}

drawChart();
</script>
